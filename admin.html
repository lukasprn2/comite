<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="logocomite.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a2342">
<title>Administration — Comité de la Somme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bleu:#0a2342;--bleu2:#0d3060;--or:#c9a84c;--orl:#e2c87a;--fond:#f5f4f0;--gris:#dfe3e8;
  --txt:#1a1f2e;--mut:#667085;--ko:#b3261e;--ok:#18794e;--r:10px;
  --sh:0 1px 2px rgba(10,35,66,.06),0 4px 14px rgba(10,35,66,.06);
  --sh2:0 2px 4px rgba(10,35,66,.08),0 12px 28px rgba(10,35,66,.12)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--fond);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
a{color:var(--bleu)}
.ic{flex-shrink:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1.5px solid transparent;border-radius:8px;padding:.6rem 1.1rem;font-weight:700;font-size:.92rem;min-height:44px;letter-spacing:.2px;text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn.load{opacity:.65;pointer-events:none}
.b-or{background:var(--or);color:var(--bleu)}.b-or:hover{background:var(--orl)}
.b-bl{background:var(--bleu);color:#fff}.b-bl:hover{background:var(--bleu2)}
.b-ln{background:#fff;border-color:var(--gris);color:var(--bleu)}.b-ln:hover{border-color:var(--or);background:#fffdf6}
.b-ko{background:#fff;border-color:#efc4c0;color:var(--ko)}.b-ko:hover{background:#fdeceb;border-color:#e6a8a2}
.b-ko-s{background:var(--ko);color:#fff}.b-ko-s:hover{background:#962019}
.b-ic{padding:.5rem;min-width:44px}

/* Champs */
input,select,textarea{width:100%;font:inherit;font-size:1rem;color:var(--txt);padding:.65rem .85rem;border:1.5px solid var(--gris);border-radius:8px;background:#fff;min-height:44px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical}
input:hover,select:hover,textarea:hover{border-color:#c4cad3}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(201,168,76,.28)}
button:focus-visible,a:focus-visible{outline:3px solid var(--or);outline-offset:2px;border-radius:6px}
label{display:block;font-size:.78rem;font-weight:700;color:var(--bleu);margin:0 0 .35rem;letter-spacing:.2px}
label .rq{color:var(--ko);margin-left:2px}
.f{margin-bottom:1rem}

/* Connexion */
#login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--bleu),var(--bleu2) 55%,#1a5276)}
.box{background:#fff;border-radius:16px;padding:2.2rem 2rem 2rem;width:100%;max-width:400px;text-align:center;border-top:4px solid var(--or);box-shadow:var(--sh2)}
.box img{width:84px;height:auto;margin-bottom:.6rem}
.box h1{font-family:'Bebas Neue';font-weight:400;letter-spacing:2px;font-size:2rem;margin:0;color:var(--bleu);line-height:1.1}
.box .sub{color:var(--mut);margin:.2rem 0 1.5rem;font-size:.9rem}
.box .f{text-align:left}
.pwrap{position:relative}.pwrap input{padding-right:3rem}
.pwrap button{position:absolute;right:2px;top:2px;bottom:2px;width:44px;background:none;border:0;color:var(--mut);border-radius:6px;display:grid;place-items:center}
.pwrap button:hover{color:var(--bleu)}
.lerr{background:#fdeceb;color:var(--ko);border:1px solid #efc4c0;border-radius:8px;padding:.6rem .8rem;font-size:.88rem;margin-bottom:1rem;text-align:left}
.box .lnk{margin:1.1rem 0 0;font-size:.88rem}

/* Bandeau */
header{background:var(--bleu);border-bottom:3px solid var(--or);color:#fff;padding:.6rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.brand img{height:42px;width:auto}
.brand b{font-family:'Bebas Neue';font-weight:400;font-size:1.4rem;letter-spacing:1.5px;display:block;line-height:1}
.brand small{color:var(--orl);font-size:.7rem;letter-spacing:1.2px}
.hr{display:flex;gap:.5rem;align-items:center}
.hr a{color:var(--orl);font-weight:700;font-size:.85rem;text-decoration:none;padding:.5rem .6rem;display:inline-flex;align-items:center;gap:.35rem;border-radius:6px}
.hr a:hover{background:rgba(255,255,255,.08)}
.hr .btn{min-height:38px;padding:.3rem .9rem;font-size:.85rem}

/* Menu hamburger */
header{position:sticky;top:0;z-index:30}
.lft{display:flex;align-items:center;gap:.75rem;min-width:0}
#burger{display:inline-flex;align-items:center;gap:.5rem;position:relative;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;min-height:44px;padding:.4rem .8rem;font-weight:700;font-size:.88rem}
#burger:hover{background:rgba(255,255,255,.14);border-color:var(--or)}
#curname{color:var(--orl);max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scrim{position:fixed;inset:0;background:rgba(10,35,66,.55);z-index:40}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:#fff;z-index:50;display:flex;flex-direction:column;border-right:4px solid var(--or);box-shadow:var(--sh2);transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
#drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.dh{display:flex;justify-content:space-between;align-items:center;padding:.6rem .6rem .6rem 1rem;background:var(--bleu);color:#fff}
.dh b{font-family:'Bebas Neue';font-weight:400;font-size:1.5rem;letter-spacing:2px}
.dh button{background:none;border:0;color:#fff;min-width:44px;min-height:44px;border-radius:8px;display:grid;place-items:center}
.dh button:hover{background:rgba(255,255,255,.12)}
#tabs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:.4rem .6rem 1.2rem}
.dg{font-size:.7rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:1rem .6rem .3rem}
#tabs button{width:100%;display:flex;align-items:center;gap:.8rem;min-height:46px;padding:.5rem .7rem;background:none;border:0;border-left:3px solid transparent;border-radius:8px;color:var(--txt);font-weight:700;font-size:.95rem;text-align:left}
#tabs button:hover{background:#faf8f2;color:var(--bleu)}
#tabs button.on{background:#fbf7e9;color:var(--bleu);border-left-color:var(--or)}
.nb{margin-left:auto;background:var(--ko);color:#fff;border-radius:99px;font-size:.7rem;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
#burger .nb.dot{position:absolute;top:-4px;right:-4px;min-width:12px;height:12px;padding:0;border:2px solid var(--bleu)}
main{max-width:960px;margin:0 auto;padding:1.6rem 1rem 4rem}

/* Titres de page */
.ph{margin-bottom:1.3rem}
.ph h1{font-family:'Bebas Neue';font-weight:400;letter-spacing:2px;font-size:2.2rem;color:var(--bleu);margin:0;line-height:1.1;border-bottom:3px solid var(--or);display:inline-block;padding-bottom:.15rem}
.ph p{color:var(--mut);margin:.55rem 0 0;max-width:62ch}

/* Accueil */
.hello{background:linear-gradient(160deg,var(--bleu),var(--bleu2));color:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1.2rem;border-left:5px solid var(--or);box-shadow:var(--sh)}
.hello h1{font-family:'DM Serif Display';font-weight:400;font-size:1.6rem;margin:0 0 .3rem}
.hello p{margin:0;color:rgba(255,255,255,.78)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.tile{background:#fff;border:1px solid var(--gris);border-radius:12px;padding:1.1rem 1.2rem;display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;align-items:center;text-align:left;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--or)}
.tile .i{grid-row:1/4;width:46px;height:46px;border-radius:10px;background:#fbf3d9;color:var(--bleu);display:grid;place-items:center}
.tile .n{font-family:'Bebas Neue';font-size:2.3rem;color:var(--bleu);line-height:1}
.tile b{color:var(--bleu)}
.tile small{color:var(--mut)}
.sech{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.8rem 0 .7rem}
.sech h2{font-family:'DM Serif Display';font-weight:400;font-size:1.3rem;color:var(--bleu);margin:0}
.lnkb{background:none;border:0;color:var(--bleu);font-weight:700;font-size:.88rem;padding:.4rem .2rem;text-decoration:underline;text-underline-offset:3px}
.lnkb:hover{color:var(--or)}

/* Listes */
.bar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.srch{position:relative;flex:2;min-width:200px}
.srch .ic{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.srch input{padding-left:2.5rem}
.bar select{flex:1;min-width:150px;width:auto}
.gh{font-family:'Bebas Neue';letter-spacing:2px;font-size:1.3rem;color:var(--bleu);margin:1.5rem 0 .6rem;padding-bottom:.2rem;border-bottom:2px solid var(--or);display:inline-block}
.gh span{color:var(--mut);font-size:1rem;letter-spacing:1px}
.row{background:#fff;border:1px solid var(--gris);border-radius:var(--r);padding:.7rem .9rem;margin-bottom:.5rem;display:flex;gap:.9rem;align-items:center;box-shadow:0 1px 2px rgba(10,35,66,.04);transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:#cfd5dd;box-shadow:var(--sh)}
.row.past{opacity:.6}
.row .m{flex:1;min-width:0}
.row strong{display:block;color:var(--bleu);overflow-wrap:anywhere}
.row small{color:var(--mut);overflow-wrap:anywhere;display:block}
.dt{background:var(--bleu);color:var(--or);border-radius:8px;width:54px;flex-shrink:0;text-align:center;padding:.35rem 0;font-family:'Bebas Neue';line-height:1}
.dt b{display:block;font-size:1.6rem;font-weight:400;color:var(--or)}
.dt span{font-size:.8rem;letter-spacing:1px;color:#fff}
.bd{background:var(--or);color:var(--bleu);border-radius:6px;font-family:'Bebas Neue';letter-spacing:1px;padding:.3rem .6rem;flex-shrink:0;min-width:54px;text-align:center}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 9px;border-radius:10px;margin-right:.4rem;letter-spacing:.2px}
.champ{background:#e8f0fe;color:#1a3a8a}.concours{background:#e8f9ee;color:#1a6a35}.gp{background:#fff8e0;color:#7a5500}.cdc{background:#ffe0f0;color:#8a0050}.jeunes{background:#e0f8ff;color:#005a8a}.veterans{background:#f0ede8;color:#5a3a1a}.regional{background:#f3e8ff;color:#5a1a8a}.propagande{background:#fff0e0;color:#8a4a00}
.act{display:flex;gap:.4rem;flex-shrink:0}
.act .btn{min-height:40px;padding:.3rem .8rem}
.card{background:#fff;border:1px solid var(--gris);border-radius:12px;padding:1.3rem;margin-bottom:1rem;box-shadow:var(--sh)}
.card>b{display:inline-flex;align-items:center;gap:.45rem;color:var(--bleu)}
.grid{display:grid;grid-template-columns:1fr;gap:0 1rem}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.sec{grid-column:1/-1;font-family:'DM Serif Display';font-weight:400;color:var(--bleu);font-size:1.2rem;margin:.8rem 0 .6rem;padding-bottom:.25rem;border-bottom:1px solid var(--gris)}
.sec:first-child{margin-top:0}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--fond) 35%);padding:1.2rem 0 .3rem}
.empty{text-align:center;color:var(--mut);padding:2.5rem 1rem;background:#fff;border-radius:var(--r);border:1px dashed #cfd5dd}
.empty .ic{display:block;margin:0 auto .5rem;color:#a9b1bd}

/* Fenêtres */
dialog{border:0;border-radius:14px;padding:0;width:min(620px,94vw);max-height:92vh;border-top:5px solid var(--or);box-shadow:var(--sh2);color:var(--txt)}
dialog::backdrop{background:rgba(10,35,66,.6)}
dialog form{padding:1.4rem}
dialog h2{font-family:'Bebas Neue';font-weight:400;letter-spacing:2px;font-size:1.8rem;color:var(--bleu);margin:0 0 1rem}
.mact{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;position:sticky;bottom:0;background:#fff;padding-top:.7rem}
#cfm{width:min(430px,92vw)}
#cfm .cb{padding:1.4rem}
#cfm h2{font-size:1.6rem;margin-bottom:.4rem}
#cfm p{margin:0;color:var(--mut)}

/* Notification */
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--bleu);color:#fff;padding:.85rem 1.3rem;border-radius:10px;z-index:99;max-width:92vw;border-left:5px solid var(--or);box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:.6rem;animation:up .25s ease}
#toast.err{background:var(--ko);border-left-color:#fff}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Tableaux de classement */
.tw{overflow-x:auto;border:1px solid var(--gris);border-radius:8px}
.tbl{border-collapse:collapse;min-width:100%}
.tbl th,.tbl td{padding:3px;background:#fff}
.tbl input{min-height:38px;padding:.4rem .5rem;font-size:.9rem;min-width:110px}
.tbl .th{font-weight:700;background:#faf6e8;border-color:var(--or)}
.tbl th{white-space:nowrap}
.rn{color:#889;font-size:.8rem;text-align:center;padding:0 .5rem!important}
.x{background:none;border:0;color:var(--ko);min-width:38px;min-height:38px;border-radius:6px;display:inline-grid;place-items:center;vertical-align:middle}
.x:hover{background:#fdeceb}
.hint2{color:var(--mut);font-size:.88rem;margin:.3rem 0 .7rem}
.flex{display:flex;gap:.5rem;flex-wrap:wrap}

.card.unread{border-left:5px solid var(--or)}
.f:has(.dz){grid-column:1/-1}
.dz{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;padding:1.3rem 1rem;border:2px dashed #c4cad3;border-radius:10px;background:#fcfbf7;color:var(--bleu);cursor:pointer;transition:border-color .15s,background .15s}
.dz:hover,.dz.over{border-color:var(--or);background:#fbf7e9}
.dz b{display:inline-flex;align-items:center;gap:.4rem}
.dz small{color:var(--mut);overflow-wrap:anywhere}
.dzb{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:.4rem}
#dzn{margin:.4rem 0 0}#dzn.err{color:var(--ko);font-weight:700}
.sb{display:grid;grid-template-columns:8rem 1fr 3.5rem;gap:.6rem;align-items:center;margin:.35rem 0;font-size:.9rem}
.sb i{display:block;height:14px;background:var(--bleu);border-radius:3px;min-width:2px}
.sb b{text-align:right;color:var(--bleu)}
.st-top{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.st-top button{min-height:42px;border:1.5px solid var(--gris);background:#fff;color:var(--bleu);font-weight:700;font-size:.88rem;padding:.4rem 1.1rem;border-radius:25px}
.st-top button.on,.st-top button:hover{background:var(--bleu);color:var(--or);border-color:var(--bleu)}
.st-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem;margin-bottom:1rem}
.st-tile{background:#fff;border:1px solid var(--gris);border-radius:12px;padding:1rem 1.1rem;box-shadow:var(--sh)}
.st-tile small{display:block;color:var(--mut);font-weight:700;font-size:.74rem;letter-spacing:.5px;text-transform:uppercase}
.st-tile .v{font-family:'Bebas Neue';font-size:2.6rem;color:var(--bleu);line-height:1.05;overflow-wrap:anywhere}
.st-tile .v.txt{font-size:1.9rem}
.st-tile .s{font-size:.84rem;color:var(--mut)}
.st-up{color:var(--ok);font-weight:700}.st-dn{color:var(--ko);font-weight:700}
.st-card{background:#fff;border:1px solid var(--gris);border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:var(--sh)}
.st-card h2{font-family:'DM Serif Display';font-weight:400;font-size:1.2rem;color:var(--bleu);margin:0 0 .2rem}
.st-card>p{margin:0 0 1rem;color:var(--mut);font-size:.86rem}
.st-chart{display:flex;align-items:flex-end;gap:2px;height:190px;border-bottom:2px solid var(--gris);position:relative}
.st-chart .mx{position:absolute;left:0;top:0;font-size:.7rem;color:var(--mut);background:#fff;padding-right:.3rem}
.st-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.st-bar{width:100%;max-width:28px;background:var(--bleu);border-radius:3px 3px 0 0;min-height:2px}
.st-col.td .st-bar{background:var(--or)}
.st-x{display:flex;gap:2px;margin-top:.3rem}
.st-x span{flex:1;text-align:center;font-size:.68rem;color:var(--mut);white-space:nowrap;min-width:0}
.st-pg{display:grid;grid-template-columns:7.5rem 1fr 6.2rem;gap:.7rem;align-items:center;margin:.55rem 0;font-size:.92rem}
.st-pg .t{height:16px;background:#eef0f4;border-radius:8px;overflow:hidden}
.st-pg .t i{display:block;height:100%;background:var(--or);border-radius:8px}
.st-pg b{text-align:right;color:var(--bleu)}.st-pg b small{color:var(--mut);font-weight:400}
.st-help{background:#fbf7e9;border-left:4px solid var(--or);border-radius:8px;padding:.8rem 1rem;color:#5b4a14;font-size:.86rem}
@media(max-width:520px){.row{flex-wrap:wrap}.act{width:100%}.act .btn:not(.b-ic){flex:1}.brand small{display:none}.hr a span{display:none}.brand>div{display:none}#curname{max-width:6rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="login" hidden>
  <form class="box" id="loginForm" novalidate>
    <img src="logocomite.png" alt="">
    <h1>Espace administrateur</h1>
    <p class="sub">Comité de la Somme — FFPJP</p>
    <div class="lerr" id="lerr" role="alert" hidden></div>
    <div class="f"><label for="em">Adresse email</label><input id="em" type="email" autocomplete="username" inputmode="email" required></div>
    <div class="f"><label for="pw">Mot de passe</label>
      <div class="pwrap"><input id="pw" type="password" autocomplete="current-password" required><button type="button" id="eye" aria-label="Afficher le mot de passe"></button></div>
    </div>
    <button class="btn b-or" id="lbtn" style="width:100%">Se connecter</button>
    <p class="lnk"><a href="#" id="forgot">Mot de passe oublié ?</a></p>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="lft"><button id="burger" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Ouvrir le menu"></button>
    <div class="brand"><img src="logocomite.png" alt=""><div><b>Administration</b><small>COMITÉ DE LA SOMME — FFPJP</small></div></div></div>
    <div class="hr"><a href="index.html" target="_blank" rel="noopener" id="site"></a><button class="btn b-ln" id="out"></button></div>
  </header>
  <div id="scrim" hidden></div>
  <nav id="drawer" aria-label="Sections" inert>
    <div class="dh"><b>Menu</b><button id="dclose" type="button" aria-label="Fermer le menu"></button></div>
    <div id="tabs"></div>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg" aria-labelledby="dlg-t"><form id="dform" novalidate></form></dialog>

<dialog id="cfm" aria-labelledby="cfm-t">
  <div class="cb">
    <h2 id="cfm-t"></h2><p id="cfm-m"></p>
    <div class="mact"><button type="button" class="btn b-ln" id="cfm-n">Annuler</button><button type="button" class="btn b-ko-s" id="cfm-y"></button></div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import { db, auth } from './firebase-config.js';
import { signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, doc, getDocs, getDoc, setDoc, addDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function openMenu() { drawer.removeAttribute('inert'); drawer.classList.add('open'); scrim.hidden = false; burger.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; (drawer.querySelector('.on') || drawer.querySelector('button')).focus(); }
function closeMenu() { drawer.classList.remove('open'); drawer.setAttribute('inert', ''); scrim.hidden = true; burger.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }

function start() {

async function show() {
  const m = $('#main'); m.innerHTML = empty('Chargement…', 'clip');
  try { tab === 'home' ? await viewHome() : tab === 'settings' ? await viewSettings() : tab === 'import' ? viewImport() : tab === 'classements' ? await viewClass()
    : tab === 'messages' ? await viewMessages() : tab === 'stats' ? await viewStats() : tab === 'corbeille' ? await viewTrash() : await viewList(tab); }
  catch (e) { m.innerHTML = empty(`Une erreur est survenue : ${esc(e.message)}<br>Vérifie ta connexion, les règles Firestore et ton email admin.`, 'alert'); }
}

/* Dépôt d'un fichier Excel : chaque feuille devient un tableau (comme les classements) */
let feuilles = [];
const LIM = 900000;   // limite d'un document Firestore ≈ 1 Mo
function toSheets(wb) {
  return wb.SheetNames.map(nom => {
    let rows = XLSX.utils.sheet_to_json(wb.Sheets[nom], { header: 1, defval: '', raw: false }).map(r => r.map(c => String(c).trim())).filter(r => r.some(Boolean));
    if (!rows.length) return null;
    const cnt = r => r.filter(Boolean).length, w = Math.max(...rows.slice(0, 30).map(cnt));
    rows = rows.slice(Math.max(0, rows.slice(0, 6).findIndex(r => cnt(r) >= Math.ceil(w * .6))));   // saute les lignes de titre avant l'en-tête
    const n = Math.max(...rows.map(r => r.length)), fix = r => Array.from({ length: n }, (_, i) => r[i] ?? '');
    return { nom, colonnes: fix(rows[0]), lignes: rows.slice(1).map(r => ({ v: fix(r) })) };
  }).filter(s => s && (s.lignes.length || s.colonnes.some(Boolean)));
}
function dzNote(m, err) { const n = $('#dzn'); if (n) { n.textContent = m; n.className = 'hint2' + (err ? ' err' : ''); } }
function dzDraw() {
  const z = $('#dz'); if (!z) return; z.classList.remove('over');
  z.innerHTML = feuilles.length
    ? `<b>${ic('ok', 18)}${feuilles.length} feuille${feuilles.length > 1 ? 's' : ''} prête${feuilles.length > 1 ? 's' : ''}</b><small>${feuilles.slice(0, 8).map(s => esc(s.nom) + ' (' + s.lignes.length + ' lignes)').join(' · ')}${feuilles.length > 8 ? ' …' : ''}</small><span class="dzb"><button type="button" class="btn b-ln" data-dz="pick">Remplacer le fichier</button><button type="button" class="btn b-ko" data-dz="del">Retirer</button></span>`
    : `${ic('dl', 28)}<b>Glisse ton fichier Excel ici</b><small>ou clique pour le choisir (.xlsx, .xls, .csv)</small>`;
}
async function dzTake(file) {
  if (!file) return;
  try { dzNote('Lecture du fichier…'); await loadXLSX();
    const s = toSheets(XLSX.read(await file.arrayBuffer(), { type: 'array' }));
    if (!s.length) return dzNote('Fichier vide ou illisible.', 1);
    if (JSON.stringify(s).length > LIM) return dzNote('Fichier trop volumineux : sépare-le en plusieurs documents.', 1);
    feuilles = s; dzDraw(); dzNote(`${s.length} feuille${s.length > 1 ? 's' : ''} lue${s.length > 1 ? 's' : ''} — clique sur « Enregistrer » pour les publier.`);
  } catch (er) { dzNote('Import impossible : ' + er.message, 1); }
}
function initDz(x) {
  feuilles = (x.feuilles || []).slice(); dzDraw();
  const z = $('#dz'), inp = Object.assign(document.createElement('input'), { type: 'file', accept: '.xlsx,.xls,.csv', hidden: true });
  z.after(inp);
  z.onclick = e => { if (e.target.closest('[data-dz=del]')) { feuilles = []; dzDraw(); dzNote('Fichier retiré — clique sur « Enregistrer » pour confirmer.'); } else inp.click(); };
  z.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } };
  z.ondragover = e => { e.preventDefault(); z.classList.add('over'); };
  z.ondragleave = () => z.classList.remove('over');
  z.ondrop = e => { e.preventDefault(); z.classList.remove('over'); dzTake(e.dataTransfer.files[0]); };
  inp.onchange = () => { dzTake(inp.files[0]); inp.value = ''; };
}

}
async function saveCl() {
  sync(); if (!cur.nom.trim()) return toast('Donne un nom au classement.', 1);
  const d = { nom: cur.nom.trim(), majLe: cur.majLe.trim(), ordre: cur.ordre, colonnes: cur.colonnes.map(c => c.trim()), lignes: cur.lignes.filter(r => r.v.some(x => x.trim())).map(r => ({ v: r.v.map(x => x.trim()) })) };
  try { cur._id ? await setDoc(doc(db, 'classements', cur._id), d) : await addDoc(collection(db, 'classements'), d); toast('Enregistré — visible sur le site'); show(); } catch (e) { toast('Échec : ' + e.message, 1); }
}

/* ===== Messages, Corbeille, Statistiques ===== */
const KIND = { events: ['Compétition', d => d.titre], clubs: ['Club', d => d.ville], membres: ['Membre', d => d.nom], classements: ['Classement', d => d.nom], actualites: ['Actualité', d => d.titre], annuaire: ['Site', d => d.nom], archives: ['Archive', d => d.titre], documentations: ['Documentation', d => d.titre], messages: ['Message', d => `${d.nom} — ${d.sujet || 'Sans sujet'}`] };
const fdate = t => t ? new Date(t).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

async function trash(col, id, x) {
  const { _id, ...data } = x, b = writeBatch(db);
  b.set(doc(collection(db, 'corbeille')), { col, origId: id, data, label: KIND[col][1](data) || 'Sans titre', supprimeLe: Date.now() });
  b.delete(doc(db, col, id)); await b.commit();
}
async function badge() {
  try { document.querySelectorAll('.nb').forEach(n => n.remove());
    const n = (await getDocs(collection(db, 'messages'))).docs.filter(d => !d.data().lu).length;
    if (!n) return;
    document.querySelector('#tabs [data-t=messages]')?.insertAdjacentHTML('beforeend', `<span class="nb" aria-label="${n} non lus">${n}</span>`);
    burger.insertAdjacentHTML('beforeend', `<span class="nb dot" aria-label="${n} messages non lus"></span>`); } catch {}
}

async function viewMessages() {
  const l = (await getDocs(collection(db, 'messages'))).docs.map(d => ({ ...d.data(), _id: d.id })).sort((a, b) => (b.creeLe || 0) - (a.creeLe || 0));
  $('#main').innerHTML = head('Messages', 'Les messages envoyés depuis le formulaire de contact du site.') +
    `<div class="bar"><select id="mf" aria-label="Filtrer les messages"><option value="">Tous les messages</option><option value="nl">Non lus</option><option value="nt">Non traités</option></select></div><div id="list"></div>`;
  const draw = () => { const f = $('#mf').value, v = l.filter(m => f === 'nl' ? !m.lu : f === 'nt' ? !m.traite : true);
    $('#list').innerHTML = v.length ? v.map(m => `<div class="card ${m.lu ? '' : 'unread'}"><strong>${esc(m.sujet || 'Sans sujet')}</strong> ${m.lu ? '' : '<span class="pill champ">Nouveau</span>'}${m.traite ? '<span class="pill concours">Traité</span>' : ''}
      <small style="display:block;color:var(--mut)">${esc(m.nom)} · ${esc(m.email)} · ${fdate(m.creeLe)}</small>
      <p style="white-space:pre-wrap;margin:.7rem 0">${esc(m.message)}</p>
      <div class="flex"><a class="btn b-bl" data-a="re" data-id="${m._id}" href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Re: ' + (m.sujet || ''))}">${ic('mail', 16)}Répondre</a>
      <button class="btn b-ln" data-a="lu" data-id="${m._id}">${m.lu ? 'Marquer non lu' : 'Marquer lu'}</button>
      <button class="btn b-ln" data-a="tr" data-id="${m._id}">${m.traite ? 'Rouvrir' : 'Marquer traité'}</button>
      <button class="btn b-ko b-ic" data-a="del" data-id="${m._id}" aria-label="Mettre à la corbeille" title="Mettre à la corbeille">${ic('trash', 16)}</button></div></div>`).join('')
      : empty('Aucun message pour le moment.', 'mail'); };
  const save = async (m, p) => { Object.assign(m, p); await setDoc(doc(db, 'messages', m._id), p, { merge: true }); badge(); draw(); };
  draw(); $('#mf').oninput = draw;
  $('#main').onclick = async e => { const b = e.target.closest('[data-a]'); if (!b) return; const m = l.find(i => i._id === b.dataset.id), a = b.dataset.a;
    try { if (a === 'lu') await save(m, { lu: !m.lu }); else if (a === 'tr') await save(m, { traite: !m.traite }); else if (a === 're') { if (!m.lu) save(m, { lu: true }); }
      else if (a === 'del' && await ask('Mettre à la corbeille ?', 'Ce message pourra être restauré pendant 30 jours.', 'Mettre à la corbeille')) { await trash('messages', m._id, m); l.splice(l.indexOf(m), 1); badge(); draw(); toast('Placé dans la corbeille'); }
    } catch (er) { toast('Échec : ' + er.message, 1); } };
}

async function viewTrash() {
  let l = (await getDocs(collection(db, 'corbeille'))).docs.map(d => ({ ...d.data(), _id: d.id }));
  const old = l.filter(x => Date.now() - x.supprimeLe > 30 * 864e5);
  for (let i = 0; i < old.length; i += 400) { const b = writeBatch(db); old.slice(i, i + 400).forEach(x => b.delete(doc(db, 'corbeille', x._id))); await b.commit(); }
  l = l.filter(x => !old.includes(x)).sort((a, b) => b.supprimeLe - a.supprimeLe);
  $('#main').innerHTML = head('Corbeille', 'Les éléments supprimés sont conservés 30 jours, puis effacés automatiquement.') +
    (l.length ? `<div class="bar"><button class="btn b-ko" id="emp">${ic('trash', 16)}Vider la corbeille</button></div>` : '') +
    (l.length ? l.map(x => `<div class="row"><div class="m"><strong>${esc(x.label)}</strong><small>${esc(x.col === 'membres' ? ({ arbitre: 'Arbitre', educateur: 'Éducateur / Initiateur' }[x.data?.categorie] || 'Membre du comité') : (KIND[x.col]?.[0] || x.col))} · supprimé le ${fdate(x.supprimeLe)} · encore ${Math.max(1, 30 - Math.floor((Date.now() - x.supprimeLe) / 864e5))} j</small></div>
      <div class="act"><button class="btn b-ln" data-r="${x._id}">${ic('undo', 16)}Restaurer</button><button class="btn b-ko b-ic" data-x="${x._id}" aria-label="Supprimer définitivement" title="Supprimer définitivement">${ic('x', 16)}</button></div></div>`).join('')
      : empty('La corbeille est vide.', 'trash'));
  $('#main').onclick = async e => { const b = e.target.closest('[data-r],[data-x],#emp'); if (!b) return;
    try { if (b.id === 'emp') { if (!await ask('Vider la corbeille ?', 'Tout sera supprimé définitivement.', 'Tout supprimer')) return;
        for (let i = 0; i < l.length; i += 400) { const w = writeBatch(db); l.slice(i, i + 400).forEach(x => w.delete(doc(db, 'corbeille', x._id))); await w.commit(); } toast('Corbeille vidée'); }
      else { const x = l.find(i => i._id === (b.dataset.r || b.dataset.x));
        if (b.dataset.r) { const w = writeBatch(db); w.set(doc(db, x.col, x.origId), x.data); w.delete(doc(db, 'corbeille', x._id)); await w.commit(); toast('Restauré'); }
        else { if (!await ask('Supprimer définitivement ?', `« ${x.label} » ne pourra plus être récupéré.`)) return; await deleteDoc(doc(db, 'corbeille', x._id)); toast('Supprimé'); } }
      badge(); viewTrash(); } catch (er) { toast('Échec : ' + er.message, 1); } };
}

const PAGES = { accueil: 'Accueil', comite: 'Le Comité', clubs: 'Les clubs', calendrier: 'Calendrier', annuaire: 'Annuaire', classement: 'Classements', archives: 'Archives', documentations: 'Documentations' };
let statsDays = 30;
async function viewStats() {
  const snap = await getDocs(collection(db, 'stats_vues'));
  const byDay = {};
  snap.docs.forEach(d => { const p = {}; let t = 0; for (const [k, v] of Object.entries(d.data())) if (typeof v === 'number') { p[k] = v; t += v; } byDay[d.id] = { p, t }; });
  const H = head('Statistiques', 'Combien de personnes consultent le site, et quelles pages elles regardent.');
  if (!Object.values(byDay).some(x => x.t)) { $('#main').innerHTML = H + empty('Pas encore de visites enregistrées. Les chiffres apparaîtront dès que quelqu\'un ouvrira une page du site.', 'stats'); return; }

  const n = statsDays, DAY = 864e5, iso = ms => new Date(ms).toISOString().slice(0, 10);
  const range = (len, off) => Array.from({ length: len }, (_, i) => { const d = iso(Date.now() - (len - 1 - i + off) * DAY); return { d, t: byDay[d]?.t || 0, p: byDay[d]?.p || {} }; });
  const cur = range(n, 0), prev = range(n, n), sum = a => a.reduce((x, y) => x + y.t, 0);
  const total = sum(cur), before = sum(prev), todayN = byDay[iso(Date.now())]?.t || 0;
  const long = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const short = d => d.slice(8) + '/' + d.slice(5, 7);

  const pages = {}; cur.forEach(x => Object.entries(x.p).forEach(([k, v]) => pages[k] = (pages[k] || 0) + v));
  const top = Object.entries(pages).sort((a, b) => b[1] - a[1]), name = k => PAGES[k] || k;
  const best = cur.reduce((m, x) => x.t > m.t ? x : m, cur[0]);
  const diff = before ? Math.round((total - before) / before * 100) : null;
  const trend = diff === null ? 'Pas de période précédente à comparer' : diff === 0 ? 'Stable par rapport à la période précédente' : `<span class="${diff > 0 ? 'st-up' : 'st-dn'}">${diff > 0 ? '▲ +' : '▼ '}${diff} %</span> par rapport aux ${n} jours d'avant`;

  const mx = Math.max(...cur.map(x => x.t), 1), step = Math.ceil(n / 6);
  const lab = (x, i) => n === 7 ? ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'][new Date(x.d + 'T12:00:00').getDay()] : (i === n - 1 || i % step === 0) ? short(x.d) : '';
  const tile = (l, v, s, cls = '') => `<div class="st-tile"><small>${l}</small><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`;

  $('#main').innerHTML = H +
    `<div class="st-top" role="group" aria-label="Période">${[7, 30, 90].map(d => `<button data-p="${d}" class="${d === n ? 'on' : ''}">${d} derniers jours</button>`).join('')}</div>` +
    `<div class="st-tiles">${tile('Aujourd\'hui', todayN, todayN > 1 ? 'pages vues' : 'page vue')}${tile(`Vues sur ${n} jours`, total, trend)}${tile('Moyenne par jour', (total / n).toFixed(1).replace('.', ','), total ? `Meilleur jour : ${esc(long(best.d))} (${best.t})` : 'Aucune visite sur la période')}${tile('Page la plus vue', top.length ? esc(name(top[0][0])) : '—', top.length ? `${top[0][1]} vues (${Math.round(top[0][1] / total * 100)} %)` : '', 'txt')}</div>` +
    `<div class="st-card"><h2>Visites jour après jour</h2><p>Chaque barre est un jour. Passez la souris (ou appuyez) sur une barre pour voir la date exacte. Aujourd'hui est en doré.</p>
      <div class="st-chart" role="img" aria-label="Graphique des vues par jour sur ${n} jours, maximum ${mx} vues en un jour"><span class="mx">${mx} vues</span>${cur.map(x => `<div class="st-col ${x.d === iso(Date.now()) ? 'td' : ''}" title="${esc(long(x.d))} : ${x.t} vue${x.t > 1 ? 's' : ''}"><div class="st-bar" style="height:${x.t / mx * 100}%"></div></div>`).join('')}</div>
      <div class="st-x" aria-hidden="true">${cur.map((x, i) => `<span>${lab(x, i)}</span>`).join('')}</div></div>` +
    `<div class="st-card"><h2>Pages les plus consultées</h2><p>Sur les ${n} derniers jours.</p>${top.length ? top.map(([k, v]) => `<div class="st-pg"><span>${esc(name(k))}</span><div class="t"><i style="width:${v / top[0][1] * 100}%"></i></div><b>${v} <small>(${Math.round(v / total * 100)} %)</small></b></div>`).join('') : '<p class="ex-empty">Aucune visite sur cette période.</p>'}</div>` +
    `<div class="st-help"><b>À savoir :</b> une « vue » correspond à une page ouverte par un visiteur, comptée une seule fois par visite. Aucun cookie ni donnée personnelle n'est utilisé, donc les chiffres sont des ordres de grandeur.</div>`;
  $('#main').onclick = e => { const b = e.target.closest('[data-p]'); if (b) { statsDays = +b.dataset.p; viewStats(); } };
}

/* Import du contenu actuel */
function viewImport() {
  $('#main').innerHTML = head('Import', 'À faire une seule fois au départ : copie dans Firebase ce qui est écrit aujourd\'hui dans tes pages. Attention : les données déjà présentes dans la section choisie sont remplacées.') +
  `<div class="card"><div class="flex">${[['settings', 'Infos du site'], ['membres', 'Le Comité'], ['clubs', 'Les Clubs'], ['events', 'Le Calendrier'], ['annuaire', 'L\'Annuaire']].map(([k, l]) => `<button class="btn b-bl" data-i="${k}">${ic('dl', 16)}Importer : ${l}</button>`).join('')}</div><p id="imsg" role="status" style="font-weight:700;margin:1rem 0 0"></p></div>`;
  $('#main').onclick = async e => { const b = e.target.closest('[data-i]'); if (!b) return; const k = b.dataset.i;
    if (!await ask('Importer cette section ?', 'Les données existantes de cette section seront remplacées.', 'Importer')) return;
    try { $('#imsg').textContent = 'Import en cours…'; const n = await IMPORT[k](); $('#imsg').textContent = `Terminé (${n} élément${n > 1 ? 's' : ''}).`; } catch (er) { $('#imsg').textContent = 'Erreur : ' + er.message; } };
}
const page = async u => new DOMParser().parseFromString(await (await fetch(u + '?' + Date.now())).text(), 'text/html');
async function replaceAll(col, items, only) {
  const old = (await getDocs(collection(db, col))).docs.filter(d => !only || only(d.data()));
  for (let i = 0; i < old.length; i += 400) { const b = writeBatch(db); old.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  for (let i = 0; i < items.length; i += 400) { const b = writeBatch(db); items.slice(i, i + 400).forEach(it => b.set(doc(collection(db, col)), it)); await b.commit(); }
  return items.length;
}
const IMPORT = {
  async settings() {
    const d = await page('index.html'), t = s => d.querySelector(s)?.textContent.trim() || '', s = { heroDesc: t('.hero-desc') };
    [...d.querySelectorAll('.stat-item')].forEach((el, i) => { s[`stat${i + 1}v`] = el.querySelector('strong').textContent; s[`stat${i + 1}l`] = el.querySelector('span').textContent; });
    const c = [...d.querySelectorAll('.contact-detail-text')];
    s.adresse = c[0].querySelector('span').innerHTML.replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, '').trim();
    s.tel = c[1].querySelector('a').textContent; s.email = c[2].querySelector('a').textContent; s.emailDev = c[3].querySelector('a').textContent;
    const pdf = (await page('calendrier.html')).querySelector('.dl-btn'); if (pdf) { s.pdfUrl = pdf.getAttribute('href'); s.pdfLabel = pdf.textContent.replace('⬇', '').trim(); }
    await setDoc(doc(db, 'settings', 'general'), s); return 1;
  },
  async membres() {
    // Seuls les membres du comité sont lus dans la page et remplacés : arbitres et éducateurs ne sont pas touchés.
    const d = await page('comite.html'), g = ['president', 'vice', 'admin', 'membre'];
    return replaceAll('membres', [...d.querySelectorAll('#panel-comite .org-card')].map((el, i) => { const tels = el.querySelectorAll('.org-tel');
      return { categorie: 'comite', groupe: g.find(k => el.classList.contains(k)) || 'membre', role: el.querySelector('.org-role').textContent.trim(), nom: el.querySelector('.org-name').textContent.trim(),
        tel: tels[0]?.textContent.trim() || '', email: el.querySelector('.org-email')?.textContent.trim() || '', adresse: tels.length > 1 ? tels[tels.length - 1].textContent.trim() : '', ordre: i + 1 }; }),
      m => catOf(m) === 'comite');
  },
  async clubs() {
    const d = await page('clubs.html'), map = { 'Président': 'president', 'Présidente': 'president', 'Adresse': 'adresse', 'Téléphone': 'tel', 'Email': 'email', 'Terrain': 'terrain' };
    return replaceAll('clubs', [...d.querySelectorAll('.club-card')].map(el => { const c = { num: el.querySelector('.club-num').textContent, secteur: el.dataset.secteur, assoc: el.querySelector('.club-nom-assoc').textContent, ville: el.querySelector('h3').firstChild.textContent, prLabel: 'Président', tel: '', email: '', adresse: '', terrain: '', president: '' };
      el.querySelectorAll('.club-info-row div').forEach(r => { const l = r.querySelector('.club-info-label').textContent; if (l.startsWith('Présid')) c.prLabel = l; if (map[l]) c[map[l]] = r.textContent.slice(l.length).trim(); }); return c; }));
  },
  async events() {
    const txt = await (await fetch('calendrier.html?' + Date.now())).text(), m = txt.match(/const EVENTS = (\[[\s\S]*?\n\s*\]);/);
    if (!m) throw new Error('Calendrier introuvable dans calendrier.html');
    return replaceAll('events', new Function('return ' + m[1])().map(e => ({ date: e.date, titre: e.titre, type: e.type, lieu: e.lieu || '', heure: e.heure || '', formation: e.formation || '', obs: e.obs || '', lien: '', lienTexte: '', lien2: '', lien2Texte: '' })));
  },
  async annuaire() {
    return replaceAll('annuaire', [
      ['60', 'Comité de l\'Oise', 'https://ffpjp-comite-oise-petanque.e-monsite.com'],
      ['59', 'Comité du Nord', 'https://ffpjp-nord.org/'],
      ['62', 'Comité du Pas-de-Calais', 'https://www.ffpjp62.fr/'],
      ['02', 'Comité de l\'Aisne', 'https://www.ffpjp-comite-aisne-petanque.com/']
    ].map(([num, nom, url], i) => ({ num, nom, desc: 'Site du ' + nom.toLowerCase(), url, ordre: i + 1 })));
  }
};
